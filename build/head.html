<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hue Harbor — color palette browser</title>
<meta name="description" content="Hue Harbor: an offline, single-file color palette browser. Pick any color and browse mood, color-theory and modern harmonies that include it.">
<style>
:root{
  --bg:#f5f6f8;--panel:#ffffff;--panel2:#eef0f3;--text:#1c1f24;--muted:#5d6572;--border:#d9dde3;
  --accent:#2f6fed;--accent-text:#ffffff;--focus:#2f6fed;--danger:#c9342b;--shadow:0 6px 24px rgba(20,24,30,.10);
  --radius:12px;--radius-s:8px;
  --page-text:var(--text);--page-muted:var(--muted);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --bg:#15171b;--panel:#1e2126;--panel2:#262a31;--text:#e8eaee;--muted:#9aa3b0;--border:#333942;
  --accent:#6b9cff;--accent-text:#0d1322;--focus:#8db2ff;--danger:#ff7066;--shadow:0 6px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--page-text);line-height:1.45;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
header{display:flex;color:var(--text);align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.2px}
.brand .logo{width:26px;height:26px;border-radius:50%;background:conic-gradient(#ef4444,#f59e0b,#eab308,#22c55e,#06b6d4,#3b82f6,#8b5cf6,#ec4899,#ef4444);box-shadow:inset 0 0 0 5px var(--panel)}
nav.modes{display:flex;gap:4px;margin-left:10px;background:var(--panel2);padding:4px;border-radius:999px}
nav.modes button{border:0;background:transparent;padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:600}
nav.modes button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.spacer{flex:1}
.iconbtn{border:1px solid var(--border);background:var(--panel);border-radius:999px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.iconbtn:hover{background:var(--panel2)}
.bgbtn{border:1px solid var(--border);background:var(--panel);border-radius:999px;height:36px;padding:0 12px 0 5px;display:inline-flex;align-items:center;gap:7px;color:var(--text);font-weight:600;font-size:13px}
.bgbtn:hover{background:var(--panel2)}
.bgbtn .bgsw{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--bg);box-shadow:inset 0 0 0 2px var(--panel)}
.bg-pop{width:272px}
.bg-pop .row{display:flex;gap:8px;align-items:center}
.bg-pop input[type=color]{width:44px;height:36px;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);cursor:pointer}
.bg-pop input[type=text]{flex:1;font-family:var(--mono);border:1px solid var(--border);border-radius:8px;padding:7px 9px;background:var(--panel2)}
.bg-pop .bgchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bg-pop .bgchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel2);border-radius:999px;padding:3px 9px 3px 4px;font-size:12px;font-family:var(--mono)}
.bg-pop .bgchip[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.bg-pop .bgchip .dot{width:18px;height:18px;border-radius:50%;border:1px solid var(--border)}
.bg-pop .bgchip.reset{font-family:var(--font);font-weight:600;padding:3px 10px}
.bg-pop .hint{margin:8px 0 0}
@media (max-width:720px){.bgbtn .bglbl{display:none}.bgbtn{padding-right:5px}header{flex-wrap:wrap;gap:8px 10px;padding:8px 12px}header .spacer{flex:1 1 auto}nav.modes{order:5;flex-basis:100%;justify-content:center;margin-left:0}nav.modes button{padding:6px 10px;font-size:14px}}
.btn{border:1px solid var(--border);background:var(--panel);border-radius:var(--radius-s);padding:7px 12px;font-weight:600;color:var(--text);display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;color:var(--text);border:1px solid var(--border);border-radius:var(--radius-s);overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 11px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text)}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;padding:18px;max-width:1500px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr;padding:12px}}
aside.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto;scrollbar-width:thin}
@media (max-width:900px){aside.side{position:static;max-height:none}}
.card{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
label.lbl{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:3px}
input[type=text],input[type=number],select,textarea{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-s);padding:6px 8px;width:100%}
input.mono{font-family:var(--mono)}
.hidden{display:none !important}

/* ---------- picker ---------- */
.picker-sv{position:relative;width:100%;aspect-ratio:1.9;border-radius:var(--radius-s);overflow:hidden;cursor:crosshair;touch-action:none;border:1px solid var(--border)}
.picker-sv canvas{width:100%;height:100%;display:block}
.picker-thumb{position:absolute;width:16px;height:16px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1.5px rgba(0,0,0,.6);transform:translate(-50%,-50%);pointer-events:none}
.hue-slider{-webkit-appearance:none;appearance:none;width:100%;height:16px;border-radius:999px;margin:10px 0 4px;border:1px solid var(--border);
 background:linear-gradient(90deg,#f00 0,#ff0 16.6%,#0f0 33.3%,#0ff 50%,#00f 66.6%,#f0f 83.3%,#f00 100%)}
.hue-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #333;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.hue-slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #333}
.picker-preview{display:flex;align-items:center;gap:10px;margin:8px 0}
.picker-preview .big{width:46px;height:46px;border-radius:var(--radius-s);border:1px solid var(--border);flex:none}
.picker-preview .big{box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fields .full{grid-column:1/-1}
.native-color{flex:none;width:36px;height:36px;padding:0;border:1px solid var(--border);border-radius:var(--radius-s);background:none;cursor:pointer}
/* Firefox draws its own inner frame around colour inputs; normalise so both engines look alike */
.native-color,.bg-pop input[type=color]{-moz-appearance:none;appearance:none}
.native-color::-moz-color-swatch,.bg-pop input[type=color]::-moz-color-swatch{border:0;border-radius:6px}
.native-color::-webkit-color-swatch-wrapper,.bg-pop input[type=color]::-webkit-color-swatch-wrapper{padding:3px}
.native-color::-webkit-color-swatch,.bg-pop input[type=color]::-webkit-color-swatch{border:0;border-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer;padding:0}

/* ---------- type list ---------- */
.typegroups{display:flex;flex-direction:column;gap:6px}
.typegroup h3{margin:6px 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.typelist{display:flex;flex-wrap:wrap;gap:4px}
.typelist button{border:1px solid var(--border);background:var(--panel2);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--text)}
.typelist button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.typelist hr{width:100%;border:0;border-top:1px dashed var(--border);margin:2px 0}

/* ---------- content ---------- */
.content{display:flex;flex-direction:column;gap:12px;min-width:0}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar h1{font-size:20px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.toolbar .sub{color:var(--page-muted);font-size:13px}
.counter{font-variant-numeric:tabular-nums;color:var(--page-muted);font-weight:600;min-width:80px;text-align:center}
.ibtn{width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:var(--panel);font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:14px;line-height:1;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.ibtn:hover{color:var(--text)}

/* palette cards */
.pal{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.pal.current{box-shadow:0 0 0 3px var(--accent)}
.pal .strip{display:flex;height:120px}
.pal.big .strip{height:min(46vh,420px)}
.pal .sw{flex:1;position:relative;border:0;padding:0;cursor:pointer;transition:flex .18s ease;min-width:0}
.pal .sw:hover{flex:1.35}
.pal .sw:focus-visible{outline-offset:-4px}
.pal .sw .tag{position:absolute;left:8px;bottom:8px;font-family:var(--mono);font-size:12px;padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.45);color:#fff;opacity:0;transition:opacity .15s}
.pal .sw:hover .tag,.pal.big .sw .tag{opacity:1}
.pal .sw .pin{position:absolute;top:8px;right:8px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.55);}
.pal .sw .pin::after{content:"";position:absolute;inset:4px;border-radius:50%;background:#111}
.pal .foot{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:13px;flex-wrap:wrap}
.pal .foot .name{font-weight:600;flex:1;min-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal .foot .name small{color:var(--muted);font-weight:500;margin-left:6px}
.pal .foot .acts{display:flex;gap:4px;flex-wrap:wrap}
.pal:not(.big) .foot .name{flex-basis:100%;min-width:0}
.pal .foot .acts button{border:1px solid var(--border);background:var(--panel);border-radius:6px;padding:2px 7px;font-size:11.5px;color:var(--text);white-space:nowrap}
.pal .foot .acts button:hover{background:var(--panel2)}
.pal .foot .acts button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rows{display:flex;flex-direction:column;gap:12px}
.rows .pal .strip{height:88px}
.single{display:flex;flex-direction:column;gap:12px}
.nav-single{display:flex;align-items:center;justify-content:center;gap:12px}
.empty{color:var(--page-muted);text-align:center;padding:48px 12px}

/* library */
.lib-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.lib-filters .f{min-width:180px;flex:1}
.basegrid{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin-top:8px}
.basegrid button{aspect-ratio:1;border:1px solid rgba(0,0,0,.12);border-radius:4px;padding:0;cursor:pointer}
.basegrid button[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
.basegrid .blank{visibility:hidden}

/* lists mode */
.listbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.listbar select{width:auto;min-width:200px}

/* popover (swatch info) */
.pop{position:fixed;color:var(--text);z-index:60;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;width:290px;max-width:calc(100vw - 16px)}
.pop .head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.pop .head .sw{width:44px;height:44px;border-radius:8px;border:1px solid var(--border)}
.pop .head .ttl{font-weight:700}
.pop .head .ttl small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:13px}
.kv .k{color:var(--muted);font-weight:600}
.kv .v{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.kv button{border:1px solid var(--border);background:var(--panel2);border-radius:6px;padding:2px 7px;font-size:12px}
.pop .foot{display:flex;gap:6px;margin-top:10px;justify-content:flex-end;flex-wrap:wrap}
.info-pop{width:320px;font-size:14px}
.info-pop h4{margin:0 0 6px;font-size:15px}
.info-pop p{margin:0;color:var(--text)}

/* modals */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--panel);color:var(--text);border-radius:var(--radius);box-shadow:var(--shadow);width:min(960px,100%);max-height:94vh;overflow:auto;padding:18px;border:1px solid var(--border)}
.modal .box.narrow{width:min(620px,100%)}
.modal h2{margin:0 0 6px;font-size:20px}
.modal h3{font-size:15px;margin:16px 0 6px}
.modal p,.modal li{font-size:14px}
.modal .close{float:right}
.mag-stage{border-radius:var(--radius);overflow:hidden;height:min(60vh,520px);position:relative;border:1px solid var(--border)}
.mag-stage .cell{position:absolute;cursor:pointer}
.mag-stage .sample{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;pointer-events:none;font-size:18px;font-weight:600}
.mag-stage .sample .light{color:#fff}
.mag-stage .sample .dark{color:#111;margin-left:12px}
.mag-stage .sample small{display:block;opacity:.8;font-weight:400;font-size:13px;margin-top:2px}
.mag-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.listmgr table{width:100%;border-collapse:collapse;font-size:14px}
.listmgr td,.listmgr th{text-align:left;padding:6px 6px;border-bottom:1px solid var(--border)}
.listmgr td:last-child{text-align:right;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:all .2s;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel2)}
.contrast-note{font-size:12px;color:var(--muted)}
footer{padding:14px 18px 26px;color:var(--page-muted);font-size:12.5px;text-align:center}

/* preview modal */
.modal .box.pv-box{width:min(1120px,100%);padding:16px 18px 14px}
.pv-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pv-head h2{margin:0;font-size:18px}
.pv-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.pv-tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--panel2);padding:4px;border-radius:999px;margin-bottom:10px;width:max-content;max-width:100%}
.pv-tabs button{border:0;background:transparent;padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:600;font-size:13.5px}
.pv-tabs button[aria-selected="true"]{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.pv-stage{aspect-ratio:8/5;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);background:var(--panel2);max-height:62vh;margin:0 auto}
.pv-stage svg,.pv-stage canvas{display:block;width:100%;height:100%;object-fit:contain}
.pv-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.pv-roles{display:flex;gap:6px;flex-wrap:wrap}
.pv-role{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:3px 9px 3px 4px}
.pv-role i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:inline-block}
.pv-range{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.pv-range input{width:140px;accent-color:var(--accent)}
.pv-pct{font-variant-numeric:tabular-nums;min-width:38px}
.pv-duowrap{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.pv-duo{display:inline-flex;gap:4px}
.pv-dot{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.2);padding:0}
.pv-dot[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
